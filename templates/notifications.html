{% extends "base.html" %}{% block title %}Notifications{% endblock %}{% block crumb %}Notifications{% endblock %}
{% block content %}<div class="page-head"><div><h1>Class Notifications</h1><p>Arrival notifications and absence alerts for your assigned students.</p></div><button class="btn btn-warning" onclick="sendAbsences()">Check today's absences</button></div><div class="card"><div id="body"></div></div><script>async function load(){const r=await fetch('/api/notifications');const d=await r.json();body.innerHTML=d.length?d.map(n=>`<div class="notification ${n.read?'read':''}"><div><span class="badge ${n.kind==='arrival'?'badge-green':'badge-red'}">${n.kind}</span><strong>${esc(n.message)}</strong><div class="small muted">${formatIndianDateTime(n.created_at)} • ${n.status}</div></div>${n.read?'':'<button class="btn btn-light" onclick="readN('+n.id+')">Mark read</button>'}</div>`).join(''):'<div class="empty">No notifications yet.</div>'}async function readN(id){await fetch('/api/notifications/'+id+'/read',{method:'POST'});load()}async function sendAbsences(){const r=await fetch('{{ '/api/teacher/send-absence-alerts' if session.get('teacher_id') else '/api/admin/send-absence-alerts' }}',{method:'POST'});const d=await r.json();alert(d.message||`Processed ${d.processed||0}; SMS sent ${d.sms_sent||0}`);load()}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}load();setInterval(load,30000)</script>{% endblock %}{% block head %}<style>.notification{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}.notification.read{opacity:.65}.notification strong{display:block;margin:8px 0 4px}</style>{% endblock %}
