{% extends "base.html" %}
{% block title %}Audit Log{% endblock %}
{% block crumb %}Audit Log{% endblock %}
{% block content %}<div class="page-head"><div><h1>Audit Log</h1><p>Actions recorded for traceability.</p></div><span id="status" class="small muted">Loading…</span></div><div class="card table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Description</th></tr></thead><tbody id="body"></tbody></table></div><script>(async()=>{const b=document.getElementById('body'),s=document.getElementById('status');try{const r=await apiFetch('/api/admin/audit'),d=await readJSON(r);if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);s.textContent=`${d.length} entr${d.length===1?'y':'ies'}`;b.innerHTML=d.length?d.map(x=>`<tr><td>${escapeHtml(x.timestamp)}</td><td>${escapeHtml(x.actor)}</td><td><span class="badge badge-gray">${escapeHtml(x.action)}</span></td><td>${escapeHtml(x.description)}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">No audit entries.</td></tr>'}catch(e){s.textContent='Unable to load';b.innerHTML=`<tr><td colspan="4" class="empty">${escapeHtml(e.message)}</td></tr>`}})();</script>{% endblock %}
