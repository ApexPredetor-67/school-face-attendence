services:
  - type: web
    name: school-attendance-system
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && pip install --no-deps face-recognition==1.3.0
    startCommand: gunicorn --workers 1 --threads 4 --timeout 180 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: DATA_DIR
        value: /tmp
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: SUPABASE_DB_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ATTENDANCE_THRESHOLD
        value: "75"
      - key: WORKING_DAYS
        value: "6"
      - key: FACE_RECOGNITION_TOLERANCE
        value: "0.48"
      - key: MIN_FACE_SAMPLES
        value: "10"
      - key: ATTENDANCE_PRESENT_FROM
        value: "07:30"
      - key: ATTENDANCE_LATE_AFTER
        value: "08:30"
      - key: ATTENDANCE_ABSENT_AFTER
        value: "09:00"
